name: ニュース更新

on:
  schedule:
    # UTC 表記。サバ時間(UTC+8)の 8:00 / 14:00 / 20:00 / 翌2:00 にあたる
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:        # 手動実行用
  push:
    paths:
      - 'feeds.json'        # 収集条件を変えたらすぐ反映

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ニュース取得と翻訳
        run: python3 fetch_news.py

      - name: 変更があればコミット
        run: |
          if git diff --quiet -- news.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "ニュース更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
